# Every hour: fetch Blizzard's auction data, update the price history and publish the page.
#
# GitHub often delays or skips scheduled runs, so the schedule checks every 10 minutes and the
# "gate" job only lets a run through when the published data is over 45 minutes old. That check
# takes a few seconds. Pushing a change, or the Run workflow button, always runs straight away.
#
# The price history (flips.db) is kept as a file on a release called "data" in this repo,
# so the repo itself doesn't grow. Don't delete that release, or the history starts over.
#
# Everything published is encrypted with the SITE_PASSWORD secret: the page's data files
# (decrypted in the browser) and the stored database (openssl). Changing SITE_PASSWORD makes
# the stored database unreadable, so the job fails; delete the release to start over.

name: Collect auction data

on:
  schedule:
    - cron: "7-59/10 * * * *"   # every 10 minutes, off the busy top of the hour; see the gate job
  workflow_dispatch:             # "Run workflow" button in the Actions tab
  push:                          # publish code changes straight away
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: write   # store the database on the release, and the keep-alive commit
  pages: write      # publish the page
  id-token: write   # needed by deploy-pages

concurrency:
  group: collect
  cancel-in-progress: false   # never let two runs write the database at the same time

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          lm=$(curl -sfI "https://${owner,,}.github.io/${repo}/data/latest.json" | grep -i '^last-modified:' | cut -d' ' -f2- | tr -d '\r' || true)
          age=$(( $(date +%s) - $(date -d "${lm:-1970-01-01}" +%s) ))
          echo "Published data is $((age / 60)) minutes old"
          if [ "$age" -gt 2700 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      REGION: ${{ vars.REGION || 'eu' }}
      RULESET: ${{ vars.RULESET || '1' }}
      FACTION: ${{ vars.FACTION || 'horde' }}
    steps:
      - name: Check the secrets are set
        run: |
          missing=""
          for s in BLIZZARD_CLIENT_ID BLIZZARD_CLIENT_SECRET SITE_PASSWORD; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests cryptography

      - name: Download the price history
        run: |
          assets=$(gh release view data --json assets -q '.assets[].name' 2>/dev/null) || {
            echo "First run: creating the 'data' release that stores the database"
            gh release create data --title "Price history" --latest=false \
              --notes "Encrypted database used by the hourly job. Don't delete this release, or the price history starts over."
          }
          # an unencrypted copy from before the password was added: remove it
          if echo "$assets" | grep -qx flips.db.gz; then gh release delete-asset data flips.db.gz -y; fi
          if echo "$assets" | grep -qx flips.db.gz.enc; then
            gh release download data -p flips.db.gz.enc
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SITE_PASSWORD -in flips.db.gz.enc -out flips.db.gz \
              || { echo "::error::Can't decrypt the stored price history. Was SITE_PASSWORD changed? Delete the 'data' release to start over."; exit 1; }
            gunzip flips.db.gz
          fi

      - name: Fetch auctions and build the page
        id: collect
        run: python cloud.py --db flips.db --out site --require-password

      - name: Save the price history
        run: |
          gzip -9 flips.db
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:SITE_PASSWORD -in flips.db.gz -out flips.db.gz.enc
          gh release upload data flips.db.gz.enc --clobber

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub switches off scheduled jobs in repos with no commits for 60 days.
      - name: Keep the hourly schedule alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the hourly schedule alive"
            git push
          fi

      - name: Report a failed fetch
        if: steps.collect.outputs.failed == 'true'
        run: |
          echo "Blizzard fetch failed; the page was still published and shows the error."
          exit 1
